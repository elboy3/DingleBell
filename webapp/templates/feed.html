{% extends "base.html" %}
{% block content %}
  <form method="get" action="/" class="controls">
    <label>Sort:
      <select name="sort" onchange="this.form.submit()">
        <option value="ai" {{ "selected" if sort == "ai" }}>AI match</option>
        <option value="ours" {{ "selected" if sort == "ours" }}>Our ratings</option>
      </select>
    </label>
    <label>Min score:
      <input type="number" name="min_score" value="{{ min_score if min_score is not none else '' }}" placeholder="none" min="0" max="100" style="width:4em">
    </label>
    <button type="submit">Apply</button>
    {% if min_score is not none %}<a href="/?sort={{ sort }}">clear filter</a>{% endif %}
  </form>

  {% if not listings %}
    <p class="empty">No listings yet - run a scan to populate the feed.</p>
  {% endif %}

  {% for listing in listings %}
    {% include "_listing_card.html" %}
  {% endfor %}
{% endblock %}
