[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Default-ish, simple ruleset - pyflakes + pycodestyle errors, import
# sorting, and a couple of easy correctness checks. Not aiming for a
# strict/opinionated lint setup here.
select = ["E", "F", "I", "UP", "B"]

[tool.poe.tasks]
install = "uv pip install -r requirements.txt -r requirements-dev.txt"
fmt = "ruff format ."
fmt-check = "ruff format --check ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
typecheck = "ty check ."
run = "uvicorn webapp.app:app --reload"
rescore = "python -m webapp.rescore"

[tool.poe.tasks.check]
help = "Verify formatting, lint, and types without modifying anything - CI/pre-commit style"
sequence = ["fmt-check", "lint", "typecheck"]

