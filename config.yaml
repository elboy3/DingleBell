# ---- Apartment Agent Config ----

search:
  # Move-in window: 1-2 wk flex early, 1-2 day flex late
  earliest_move_in: "2026-09-01"
  latest_move_in: "2026-10-03"

  price_min: 5000
  price_max: 10000

  beds_min: 1
  baths_min: 1

  # Cast a WIDER net than your manual search - this is a filter for the
  # email pipeline only, not the shared web app's saved-search scan
  # (which uses whatever StreetEasy search is currently open). AI
  # taste-match scoring (see scoring: below) does the fine sorting.
  neighborhoods:
    - "Brooklyn Heights"
    - "Cobble Hill"
    - "Fort Greene"
    - "Boerum Hill"
    - "Clinton Hill"
    - "Prospect Heights"
    - "Williamsburg"

  no_fee_only: false        # false = show both fee and no-fee
  pets_required: false

gmail:
  # The inbox that receives StreetEasy/Zillow/RentHop/NakedApartments alerts.
  #
  # Deliberately NOT using in:inbox or is:unread, even though that seems
  # like the obvious way to track "unprocessed" mail:
  #  - in:inbox misses mail entirely - this account has a pre-existing
  #    Gmail filter that auto-archives everything from streeteasy.com
  #    (skips the Inbox), so every alert email was being silently missed.
  #  - is:unread is fragile - a human opening an alert email (likely,
  #    given two people anxiously checking this account) makes the agent
  #    silently skip it too.
  # Our own SQLite dedup (already_seen() by URL in store.py) is the real,
  # controlled "have we processed this" check - Gmail's read/label state
  # doesn't need to carry that responsibility. newer_than:1d still bounds
  # the query so this account's years of old backlog never gets pulled in
  # as if new (see DECISIONS.md).
  label_or_query: "(from:streeteasy.com OR from:zillow.com OR from:renthop.com OR from:nakedapartments.com) newer_than:1d"
  poll_interval_seconds: 180   # 3 min - tune based on Gmail API quota comfort

notify:
  # These are placeholders. In the public-repo/GitHub Actions deployment,
  # NOTIFY_RECIPIENTS and NOTIFY_FROM_ADDRESS env vars (set from GitHub
  # Secrets) override these at runtime so real addresses never sit in a
  # public repo. For local runs, just edit these directly.
  recipients:
    - "echartock3@gmail.com"
  from_address: "echartock3@gmail.com"
  subject_prefix: "[Apt Alert]"

storage:
  db_path: "listings.db"

scoring:
  # AI taste-match scoring for the shared web app (see webapp/scoring.py).
  # Both the file and ANTHROPIC_API_KEY env var must be present for
  # scoring to run at all - otherwise browser_import.py just skips it
  # (ingestion never blocks on scoring being unset up). profile_path
  # doesn't need to exist yet.
  profile_path: "taste_profile.md"
  profile_version: "v1-liked-only-2026-08-22"   # bump manually whenever taste_profile.md's content meaningfully changes
