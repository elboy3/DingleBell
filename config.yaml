# ---- Apartment Agent Config ----

search:
  # Move-in window: 1-2 wk flex early, 1-2 day flex late
  earliest_move_in: "2026-09-01"
  latest_move_in: "2026-10-03"

  price_min: 5000
  price_max: 10000

  beds_min: 1
  baths_min: 1

  # Cast a WIDER net than your manual search - Claude-side taste
  # filtering (Phase 2) will do the fine sorting later.
  neighborhoods:
    - "Brooklyn Heights"
    - "Cobble Hill"
    - "Fort Greene"
    - "Boerum Hill"
    - "Clinton Hill"
    - "Prospect Heights"

  no_fee_only: false        # false = show both fee and no-fee
  pets_required: false

gmail:
  # The inbox that receives StreetEasy/Zillow/RentHop/NakedApartments alerts.
  # newer_than:1d matters here - this is an existing personal Gmail account
  # with years of unread StreetEasy/Zillow backlog (old marketing emails,
  # an unrelated old home search), not a fresh inbox. Without a date bound,
  # is:unread would pull that whole backlog in as if it were new, 50
  # messages at a time every poll - and some could slip through filters.py
  # as false positives, since it treats unextractable price/beds/baths as
  # "unknown, don't block it" (intentional for real ambiguous listings, but
  # dangerous applied to years-old unrelated mail).
  label_or_query: "in:inbox (from:streeteasy.com OR from:zillow.com OR from:renthop.com OR from:nakedapartments.com) is:unread newer_than:1d"
  poll_interval_seconds: 180   # 3 min - tune based on Gmail API quota comfort

notify:
  # These are placeholders. In the public-repo/GitHub Actions deployment,
  # NOTIFY_RECIPIENTS and NOTIFY_FROM_ADDRESS env vars (set from GitHub
  # Secrets) override these at runtime so real addresses never sit in a
  # public repo. For local runs, just edit these directly.
  recipients:
    - "echartock3@gmail.com"
  from_address: "echartock3@gmail.com"
  subject_prefix: "[Apt Alert]"

storage:
  db_path: "listings.db"
